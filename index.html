<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4f8">
<title>Softplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7.5 4.8v14.4a1 1 0 0 0 1.5.9l12-7.2a1 1 0 0 0 0-1.8L9 3.9a1 1 0 0 0-1.5.9z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.6" height="16" rx="1.6" fill="currentColor"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.6" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M11.2 6.3v11.4a.9.9 0 0 1-1.4.7L2.6 12.7a.9.9 0 0 1 0-1.4l7.2-5.7a.9.9 0 0 1 1.4.7zM21.4 6.3v11.4a.9.9 0 0 1-1.4.7l-7.200-5.700a.9.9 0 0 1 0-1.400L20 5.600a.9.9 0 0 1 1.400.700z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M12.800 6.300v11.400a.9.9 0 0 0 1.400.7l7.200-5.700a.9.9 0 0 0 0-1.400L14.200 5.600a.9.9 0 0 0-1.400.7zM2.600 6.300v11.400a.9.9 0 0 0 1.400.7l7.200-5.700a.9.9 0 0 0 0-1.400L4 5.600a.9.9 0 0 0-1.400.7z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.600s-8.200-5-8.200-10.800C3.800 6.700 6 4.800 8.500 4.800c1.500 0 2.800.8 3.500 2 .7-1.200 2-2 3.500-2 2.500 0 4.700 1.900 4.700 5 0 5.800-8.200 10.800-8.200 10.800z"/></symbol>
    <symbol id="i-bow" viewBox="0 0 24 24"><g fill="currentColor"><path d="M11 12C8.300 6.800 3.800 5.200 3 8.200c-.8 3 1.800 6.200 8 3.800z"/><path d="M13 12c2.700-5.200 7.200-6.800 8-3.800.8 3-1.800 6.200-8 3.800z"/><path d="M11 13.200 6.800 20.200l3.700-1.600 1.500-4.200z"/><path d="m13 13.200 4.200 7-3.700-1.600-1.500-4.200z"/><ellipse cx="12" cy="12.100" rx="2.100" ry="2.500"/></g></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2.800 3.200 3.200L17 9.200"/><path d="M3.800 11V9.600A3.600 3.600 0 0 1 7.400 6h12.800"/><path d="m7 21.200-3.200-3.200L7 14.800"/><path d="M20.200 13v1.400a3.600 3.600 0 0 1-3.600 3.600H3.800"/></g></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path fill="currentColor" d="M3.500 9.500v5h3.600l4.600 3.900a.8.800 0 0 0 1.300-.600V6.200a.8.8 0 0 0-1.300-.600L7.100 9.500z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.200a4 4 0 0 1 0 5.600M18.600 6.600a7.600 7.600 0 0 1 0 10.800"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M3.800 17.500a8.200 8.200 0 1 1 16.400 0"/><path d="m12 17.500 4.200-5"/></g><circle cx="12" cy="17.500" r="1.800" fill="currentColor"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.500 14.600A8.600 8.600 0 0 1 9.400 3.500a8.600 8.600 0 1 0 11.100 11.100z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" d="m8 9.500 4-4 4 4M8 14.500l4 4 4-4"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path fill="currentColor" d="M19.500 3.200v11.600a3.100 3.100 0 1 1-2.200-3V6.500l-6.400 1.300v9.500a3.100 3.100 0 1 1-2.200-3V5.800a1 1 0 0 1 .8-1l8.400-1.700a1 1 0 0 1 1.200 1z"/></symbol>
    <symbol id="i-tulip" viewBox="0 0 24 24"><g fill="currentColor"><path d="M6.500 4.500c-.4 5 .6 9.400 5.500 10.200 4.900-.8 5.900-5.200 5.500-10.200l-2.900 2.300L12 3.800 9.400 6.800z"/><path d="M11.200 14.500h1.600V21h-1.600z"/><path d="M11.600 19.800c-3.200.2-5.200-1.400-5.800-4.400 3.200-.2 5.300 1.400 5.800 4.400z"/><path d="M12.400 19.800c3.200.2 5.200-1.400 5.800-4.400-3.200-.2-5.300 1.400-5.800 4.400z"/></g></symbol>
    <symbol id="i-butterfly" viewBox="0 0 24 24"><g fill="currentColor"><path d="M11.200 10.800C9.800 5.800 5 3 3 5.300c-1.600 2.200.4 6.300 8.200 5.500z"/><path d="M11.200 13c-5-.8-8.600 1.200-7.600 4.600.9 3 4.400 3.200 6 1 .9-1.400 1.600-3.400 1.600-5.600z"/><path d="M12.800 10.800C14.200 5.800 19 3 21 5.300c1.600 2.200-.4 6.300-8.200 5.500z"/><path d="M12.800 13c5-.8 8.600 1.200 7.600 4.600-.9 3-4.400 3.200-6 1-.9-1.400-1.600-3.400-1.600-5.600z"/><rect x="11.200" y="7" width="1.600" height="12" rx=".8"/></g></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.200" fill="currentColor"/><g stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M12 2.800v2M12 19.200v2M2.800 12h2M19.200 12h2M5.500 5.500l1.400 1.400M17.100 17.100l1.400 1.400M5.500 18.500l1.400-1.400M17.100 6.900l1.400-1.400"/></g></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4.500 7h15M9.500 7V4.200h5V7M6.500 7l.9 12.500h9.200L17.500 7"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round"><path d="M9.500 6.500H20M9.500 12H20M9.500 17.500H20"/></g><g fill="currentColor"><circle cx="4.800" cy="6.500" r="1.500"/><circle cx="4.800" cy="12" r="1.500"/><circle cx="4.800" cy="17.500" r="1.500"/></g></symbol>
    <symbol id="paw-mini" viewBox="4 6 92 82"><g fill="currentColor"><path d="M50 44c-13 0-25 10-27 24-1.500 11 6 17 16 16 4.500-.5 7.500-3 11-3s6.500 2.500 11 3c10 1 17.500-5 16-16-2-14-14-24-27-24z"/><ellipse cx="19" cy="45" rx="10" ry="12.500" transform="rotate(-22 19 45)"/><ellipse cx="37" cy="24" rx="11" ry="13.500" transform="rotate(-8 37 24)"/><ellipse cx="63" cy="24" rx="11" ry="13.500" transform="rotate(8 63 24)"/><ellipse cx="81" cy="45" rx="10" ry="12.500" transform="rotate(22 81 45)"/></g></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round" d="m14.500 5.500-6.500 6.500 6.500 6.500"/></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.100" stroke-linejoin="round" stroke-linecap="round"><rect x="3.500" y="7.500" width="13" height="13" rx="3.200"/><path d="M8 4h10.500A2.500 2.500 0 0 1 21 6.500V17"/></g><circle cx="10" cy="14" r="1.700" fill="currentColor"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.200-4.200L16.600 4.400a2.100 2.100 0 0 1 3 3L8.200 18.800z"/><path d="m14.500 6.500 3 3"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path fill="currentColor" d="M4 8.500A2.500 2.500 0 0 1 6.500 6h1.700l1.300-2h5l1.300 2h1.700A2.500 2.500 0 0 1 20 8.500v8a2.500 2.500 0 0 1-2.500 2.500h-11A2.500 2.500 0 0 1 4 16.500z"/><circle cx="12" cy="12.600" r="3.400" fill="none" stroke="#fff" stroke-width="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-shift" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round" d="M12 4 4.500 12h4.200v7h6.600v-7h4.200z"/></symbol>
    <symbol id="i-bs" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.500h10.500a1.500 1.500 0 0 1 1.500 1.500v10a1.500 1.500 0 0 1-1.500 1.500H9l-6-6.500z"/><path d="m12.500 9.500 5 5M17.500 9.500l-5 5"/></g></symbol>
  </defs>
</svg>

<div class="ambient" aria-hidden="true"><img id="ambient" alt="" hidden></div>

<div class="side-scrim" id="sideScrim" hidden></div>
<aside class="side" id="side" aria-label="Playlists">
  <div class="side-head">
    <svg class="ic bow" aria-hidden="true"><use href="#i-bow"/></svg>
    <span class="side-title">playlists</span>
    <button class="side-x" id="sideClose" type="button" aria-label="Close playlists"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <a class="side-page" id="sidePage" href="#playlists"><svg class="ic"><use href="#i-album"/></svg><span>playlists page</span></a>
  <button class="side-row" id="sideAll" data-open="all" type="button">
    <span class="thumb lg"><svg class="ic"><use href="#i-note"/></svg></span>
    <span class="tx"><b>all songs</b><span id="allCount">0 songs</span></span>
  </button>
  <div class="side-label">your playlists</div>
  <div class="side-list" id="plist"></div>
  <button class="side-new" id="bNewList" type="button"><svg class="ic"><use href="#i-plus"/></svg><span>new playlist</span></button>
</aside>

<main class="deck">
  <header class="top" id="top">
    <button class="hbtn menu" id="bMenu" type="button" aria-label="Open playlists" aria-expanded="false"><svg class="ic"><use href="#i-list"/></svg></button>
    <span class="status" id="status">0 songs</span>
    <a class="hbtn" id="bPage" href="#playlists" aria-label="Open the playlists page"><svg class="ic"><use href="#i-album"/></svg></a>
  </header>

  <section class="page" id="pageLists" aria-label="Playlists" hidden>
    <div class="phead">
      <a class="hbtn" id="pBack" href="#home" aria-label="Back to the player"><svg class="ic"><use href="#i-back"/></svg></a>
      <h1>playlists</h1>
      <button class="hbtn" id="pNew" type="button" aria-label="New playlist"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
    <div class="pgrid" id="pgrid"></div>
    <button class="mini" id="mini" type="button" aria-label="Back to the player" hidden>
      <span class="thumb" id="miniThumb"></span>
      <span class="tx"><b id="miniTitle">nothing playing</b><span id="miniArtist"></span></span>
      <span class="mini-play" id="miniPlay" role="button" aria-label="Play or pause"><svg class="ic"><use id="miniUse" href="#i-play"/></svg></span>
    </button>
  </section>


  <div id="home">
  <section class="grid" aria-label="Music controls">
    <button class="paw" id="bShuffle" aria-label="Shuffle" aria-pressed="false"><span class="pawbg" aria-hidden="true"></span><svg class="ic"><use href="#i-bow"/></svg></button>
    <button class="paw" id="bRepeat" aria-label="Repeat: off"><span class="pawbg" aria-hidden="true"></span><svg class="ic"><use href="#i-repeat"/></svg><span class="badge" id="repBadge" hidden>1</span></button>
    <button class="paw" id="bLike" aria-label="Like this song" aria-pressed="false"><span class="pawbg" aria-hidden="true"></span><svg class="ic"><use href="#i-heart"/></svg></button>
    <button class="paw" id="bMute" aria-label="Mute" aria-pressed="false"><span class="pawbg" aria-hidden="true"></span><span class="eq" id="eq"><span></span><span></span><span></span><span></span></span></button>

    <div class="cat np fill" aria-live="polite">
      <i class="ear l"></i><i class="ear r"></i>
      <svg class="bowtop pinkbow" aria-hidden="true"><use href="#i-bow"/></svg>
      <div class="cat-body npbody">
        <svg class="ic"><use href="#i-note"/></svg>
        <div><small id="npLabel">up next</small><b id="npTitle">nothing yet</b><span id="npArtist">add songs to start</span></div>
      </div>
    </div>

    <article class="player">
      <div class="artwrap">
        <div class="art" id="art">
          <img id="cover" alt="" hidden>
          <div class="ph" id="ph"><svg class="ic"><use href="#i-note"/></svg></div>
        </div>
        <svg class="ribbon" aria-hidden="true"><use href="#i-bow"/></svg>
      </div>
      <div class="meta">
        <div class="title" id="title">nothing playing</div>
        <div class="artist" id="artist">your songs, softly</div>
        <button class="cta" id="ctaAdd" type="button">+ add songs</button>
        <div class="ctrls">
          <button id="bPrev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button id="bPlay" aria-label="Play"><svg class="ic"><use id="playUse" href="#i-play"/></svg></button>
          <button id="bNext" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
        </div>
        <input class="scrub" id="scrub" type="range" min="0" max="1" step="any" value="0" aria-label="Seek">
        <div class="times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
      </div>
    </article>

    <div class="cat vs" id="volS" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
      <i class="ear l"></i><i class="ear r"></i>
      <svg class="bowtop blackbow" aria-hidden="true"><use href="#i-bow"/></svg>
      <div class="cat-body vsbody"><div class="vs-fill"></div><div class="vs-val" id="volVal">80</div><div class="vs-cap">vol</div><svg class="ic"><use href="#i-vol"/></svg></div>
    </div>
    <div class="cat vs" id="spdS" role="slider" tabindex="0" aria-label="Playback speed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <i class="ear l"></i><i class="ear r"></i>
      <svg class="bowtop blackbow" aria-hidden="true"><use href="#i-bow"/></svg>
      <div class="cat-body vsbody"><div class="vs-fill"></div><div class="vs-val" id="spdVal">1.0×</div><div class="vs-cap">speed</div><svg class="ic"><use href="#i-gauge"/></svg></div>
    </div>

    <button class="cat pill deep" id="bQueue" aria-label="Open library" type="button">
      <i class="ear l"></i><i class="ear r"></i>
      <span class="cat-body pillbody"><span class="deco" aria-hidden="true">ʚᵗ᷒ᰰɞ</span><span class="qt"><b>library</b><span id="qCount">0 songs</span></span></span>
    </button>
    <button class="cat pill" id="bSleep" aria-label="Sleep timer" type="button">
      <i class="ear l"></i><i class="ear r"></i>
      <span class="cat-body pillbody"><span class="moon"><svg class="ic"><use href="#i-moon"/></svg></span><span class="lbl" id="sleepLabel">sleep</span><span class="chev"><svg class="ic"><use href="#i-chev"/></svg></span></span>
    </button>

    <button class="paw" id="bAdd" aria-label="Add songs from your phone"><span class="pawbg" aria-hidden="true"></span><svg class="ic"><use href="#i-tulip"/></svg></button>
    <button class="paw" id="bSun" aria-label="Keep screen awake" aria-pressed="false"><span class="pawbg" aria-hidden="true"></span><svg class="ic"><use href="#i-sun"/></svg></button>
    <button class="paw" id="bTheme" aria-label="Change colors"><span class="pawbg" aria-hidden="true"></span><svg class="ic"><use href="#i-butterfly"/></svg></button>
    <button class="paw" id="bClear" aria-label="Clear library"><span class="pawbg" aria-hidden="true"></span><svg class="ic"><use href="#i-trash"/></svg></button>
  </section>

  <p class="hint">saved in this browser · files stay on your phone</p>
  </div>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-label="Songs">
    <div class="grab"></div>
    <div id="sheetHead"></div>
    <div id="sheetList"></div>
  </div>
</div>

<div class="scrim dlg" id="dlg" hidden>
  <div class="card" role="dialog" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle">edit song</h3>
    <button class="cvbtn big" id="dlgCover" type="button" aria-label="Change picture"><span class="cv" id="dlgCv"></span><span class="cam"><svg class="ic"><use href="#i-camera"/></svg></span></button>
    <button class="linkbtn" id="dlgReset" type="button">reset picture</button>
    <label class="fld"><span id="dlgALabel">title</span><input class="field" id="dlgA" data-kb inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60"></label>
    <label class="fld" id="dlgBWrap"><span>artist</span><input class="field" id="dlgB" data-kb inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60"></label>
    <div class="dlg-act">
      <button class="btn danger" id="dlgDel" type="button">delete</button>
      <span class="grow"></span>
      <button class="btn ghost" id="dlgCancel" type="button">cancel</button>
      <button class="btn primary" id="dlgSave" type="button">save</button>
    </div>
  </div>
</div>

<div class="scrim dlg" id="chooser" hidden>
  <div class="card" role="dialog" aria-label="Add to playlist">
    <h3>add to playlist</h3>
    <p class="sub" id="chSong"></p>
    <div class="ch-list" id="chList"></div>
    <div class="dlg-act"><span class="grow"></span><button class="btn primary" id="chDone" type="button">done</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple hidden>
<input type="file" id="imgFile" accept="image/*" hidden>
<audio id="audio" preload="metadata" playsinline></audio>

<script src="script.js?v=4"></script>
</body>
</html>
